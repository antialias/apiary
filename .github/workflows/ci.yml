# ci: the two suites and the compose smoke test (smoke/run.sh), on every push and pull request.
# Published from a private trunk with the rest of proxy/ and brain/; an edit here is overwritten
# by the next publish.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...

  brain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 test_exporter.py

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash smoke/run.sh
