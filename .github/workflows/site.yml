name: site

on:
  pull_request:
    paths: ['site/**']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
          cache: false # no deps, no go.sum — silence the cache warning
      - name: Vet & build
        working-directory: site
        run: |
          go vet ./...
          go build ./...
