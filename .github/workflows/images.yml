# images: after ci passes on a push to main, build and push the two images for amd64 and arm64:
# ghcr.io/<owner>/apiary-proxy and apiary-brain, always tagged sha-<12 hex>, and tagged latest
# only while the commit built is still main's tip. One run at a time; a running one is never
# cancelled. Both Dockerfiles build without emulation (the proxy cross-compiles on the build
# platform; the brain has no RUN).
# Published from a private trunk; an edit here is overwritten by the next publish.
name: images

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: apiary-proxy
            context: proxy
          - image: apiary-brain
            context: brain
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: name
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ${{ matrix.image }}
        run: |
          repo="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE"
          printf 'repo=%s\nsha=%s:sha-%s\n' "$repo" "$repo" "${SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
      # latest follows main's tip: asked now, after the build, so an older run finishing late
      # never moves it back.
      - name: latest, if this is still main's tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE_REPO: ${{ steps.name.outputs.repo }}
          IMAGE_SHA: ${{ steps.name.outputs.sha }}
        run: |
          tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE_REPO:latest" "$IMAGE_SHA"
            echo "tagged latest: $SHA is main's tip"
          else
            echo "latest not moved: built $SHA, main's tip is now $tip"
          fi
