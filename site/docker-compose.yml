# NOTE: local/dev example only — this file does NOT drive prod. The production
# compose is pinned on the host (see README "Deploy"); editing this changes nothing live.
services:
  apiary-site:
    build: .
    container_name: apiary-site
    restart: always
    environment:
      - LISTEN=:8080
      - SIGNUPS_FILE=/data/signups.jsonl
    volumes:
      - ./data:/data
    labels:
      - "traefik.enable=true"
      # apiary.wtf is shared with the members app (sign-in, invites, the dashboard), so this router
      # takes only the paths this site serves (main.go: the front door, /about/, /plan/, the og cards, /signup,
      # /healthz) at an explicit priority. Traefik's default priority is the rule's length, which
      # would put a short rule like this above the app's. The order on apiary.wtf:
      #   20  the app's signed-in home: Path(/) with its session cookie
      #   17  this site: the paths below (a signed-out visitor at / sees the front door)
      #   15  the app: everything else (/sign-in, /join/..., /account, /api/...)
      # www.apiary.wtf is this site's alone; it redirects to apiary.wtf.
      - "traefik.http.routers.apiary.rule=Host(`www.apiary.wtf`) || (Host(`apiary.wtf`) && (Path(`/`) || Path(`/index.html`) || PathPrefix(`/about`) || PathPrefix(`/plan`) || PathPrefix(`/og/`) || Path(`/signup`) || Path(`/healthz`)))"
      - "traefik.http.routers.apiary.priority=17"
      - "traefik.http.routers.apiary.entrypoints=websecure"
      - "traefik.http.routers.apiary.tls=true"
      - "traefik.http.routers.apiary.tls.certresolver=myresolver"
      - "traefik.http.routers.apiary.middlewares=hsts@docker"
      - "traefik.http.routers.apiary-http.rule=Host(`apiary.wtf`) || Host(`www.apiary.wtf`)"
      - "traefik.http.routers.apiary-http.entrypoints=web"
      - "traefik.http.routers.apiary-http.middlewares=redirect-https@docker"
      - "traefik.http.services.apiary.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - webgateway

networks:
  webgateway:
    external: true
